<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Apprendre la basse</title>
  <meta name="description" content="Manche, portée et tableau de correspondances des notes de la basse — une seule page, en français, hors ligne.">
  <meta name="theme-color" content="#0f2437">
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>
  <header>
    <h1>Apprendre la basse</h1>
    <!-- Conteneur des contrôles audio (curseur de volume, sourdine) — ticket 13. -->
    <div id="audio-controls"></div>
  </header>
  <main>
    <section id="fretboard-section" aria-labelledby="fretboard-title">
      <h2 id="fretboard-title">Manche</h2>
      <!-- Point de montage de la vue manche (ticket 10). -->
      <div id="fretboard" class="view"></div>
    </section>
    <section id="staff-section" aria-labelledby="staff-title">
      <h2 id="staff-title">Portée</h2>
      <!-- Point de montage de la vue portée en clé de fa (ticket 11). -->
      <div id="staff" class="view"></div>
    </section>
    <section id="table-section" aria-labelledby="table-title">
      <h2 id="table-title">Tableau de correspondances</h2>
      <!-- Point de montage du tableau de correspondances (ticket 09). -->
      <div id="table" class="view"></div>
    </section>
  </main>
  <aside id="update-notice" role="status" aria-live="polite" hidden>
    Une nouvelle version est disponible.
    <button type="button">Recharger</button>
  </aside>
  <script type="module" src="js/app.js"></script>
</body>
</html>
